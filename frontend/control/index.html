<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AIS-catcher</title>
    <link rel="stylesheet" href="css/hub.css?hash=">
</head>
<body>
    <div id="hub-container">
        <iframe id="webviewer-frame" src="/viewer/?welcome=false" allow="fullscreen" allowfullscreen
            sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>

        <div id="login-overlay" class="modal-overlay hidden">
            <div class="card sys-login-card stack-loose">
                <div class="stack-tight">
                    <h3 id="login-title" class="t-strong t-lg">Sign In</h3>
                    <p id="login-subtitle" class="t-small t-muted">Authentication required to continue.</p>
                </div>
                <div id="login-error" class="alert alert-danger hidden"></div>
                <form id="login-form" class="stack">
                    <input id="login-password" name="password" type="password" autocomplete="current-password"
                        placeholder="Password"
                        class="input" />
                    <input id="login-password2" name="password2" type="password" autocomplete="new-password"
                        placeholder="Confirm password"
                        class="input hidden" />
                    <div id="login-setup-code" class="stack-tight hidden">
                        <input id="login-code" name="setup-code" type="text" autocomplete="off" spellcheck="false"
                            placeholder="Setup code"
                            class="input" />
                        <p class="t-small t-muted">The setup code is in the log, printed when the program starts.</p>
                    </div>
                    <div class="row">
                        <button type="button" id="login-cancel"
                            class="btn grow">
                            Cancel
                        </button>
                        <button type="submit" id="login-submit"
                            class="btn grow">
                            Sign In
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Settings: the bar's Settings button opens it where it was left, the
             status dot on the log -->
        <div id="system-overlay" class="modal-overlay hidden">
            <div id="system-modal" class="modal-card">
                <div id="system-header" class="band">
                    <button id="rail-back" type="button" class="btn-quiet" aria-label="Back to the list">
                        <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
                    </button>
                    <h2 id="system-title" class="band-slot band-title">Settings</h2>
                    <button id="system-close" class="btn-quiet">
                        <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div id="settings-bar" class="st msgbar" role="status" aria-live="polite" hidden></div>
                <div id="system-layout">
                    <nav id="settings-rail" class="st st-rail" aria-label="Settings"></nav>
                    <div id="system-body"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- the settings panel's pages, cloned into #system-body each time the panel opens -->
    <template id="system-body-template">
        <div class="sys-pane hidden" data-pane="input"><div id="sys-input-body"></div></div>
        <div class="sys-pane hidden" data-pane="stations"><div id="sys-stations-body"></div></div>
        <div class="sys-pane hidden" data-pane="output"><div id="sys-output-body"></div></div>
        <div class="sys-pane hidden" data-pane="output-add"><div id="sys-output-add-body" class="st"></div></div>
        <div class="sys-pane hidden" data-pane="places"><div id="sys-places-body"></div></div>
        <div class="sys-pane hidden st st-flowpage" data-pane="flow">
            <div class="st-main__head">
                <div><h2 class="st-main__title">Flow</h2>
                <p class="st-main__desc">Which input reaches which output. A named connection is a zone.</p></div>
            </div>
            <div class="st-flow__legend"><span><i class="st-flow__key st-flow__key--all"></i>no zone: inputs and outputs without one</span><span><i class="st-flow__key"></i>a connection, in its zone's colour</span></div>
            <p id="flow-hint" class="st-flow__hint"></p>
            <form id="flow-name" class="st-flow__name" hidden></form>
            <div id="flow-patch" class="st-flow">
                <div><h2 class="st-col__title">Inputs</h2><div id="flow-inputs" class="st-stack"></div></div>
                <svg id="flow-svg" class="st-routes" aria-hidden="true"></svg>
                <div><h2 class="st-col__title">Outputs</h2><div id="flow-outputs" class="st-stack st-stack--out"></div></div>
            </div>
            <div id="flow-zones" class="st-flow__zones"></div>
        </div>
        <div class="sys-pane hidden" data-pane="services"></div>
        <!-- System's pages under one heading; the rail is their list -->
        <div id="sys-group" class="st st-single sys-group hidden">
            <div class="st-main sys-group__main">
                <div class="st-main__head"><div><h2 class="st-main__title"></h2></div></div>
                <div class="sys-pane hidden" data-pane="history"><div id="sys-history-body"></div></div>
                <div class="sys-pane hidden" data-pane="status">
                    <div class="st-sys">
                        <section class="st-sc st-recv">
                            <span class="st-recv__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4"/><circle cx="12" cy="12" r="1.6"/></svg></span>
                            <div class="st-recv__body">
                                <div class="st-recv__title"><h3>Receiver</h3><span id="hub-status" class="st-chip st-state st-state--stopped">Checking&hellip;</span></div>
                                <div class="st-recv__line"><span id="hub-counts"></span><span id="hub-uptime"></span><button type="button" class="st-link" data-open-log>Open log</button></div>
                            </div>
                            <button id="hub-engine-btn" type="button" class="st-btn st-btn--primary"></button>
                        </section>
                        <section id="hub-sysinfo-card" class="st-sc" hidden>
                            <div class="st-sc__head"><h3>System</h3><button type="button" class="st-btn st-btn--sm" data-copy-sysinfo>Copy for bug report</button></div>
                            <dl id="hub-sysinfo" class="st-facts"></dl>
                        </section>
                    </div>
                </div>
                <div class="sys-pane hidden" data-pane="config">
                    <pre id="config-json" class="term-pane">Loading...</pre>
                </div>
                <div class="sys-pane hidden" data-pane="log">
                    <div class="log-console">
                        <div class="log-toolbar">
                            <span class="log-prompt">&gt;_</span>
                            <select id="log-level" class="log-control"
                                    title="Filters this console; the receiver records down to control.level (debug by default)">
                                <option value="debug">debug</option>
                                <option value="info">info</option>
                                <option value="warning">warning</option>
                                <option value="error">error</option>
                                <option value="critical">critical</option>
                            </select>
                            <input id="log-search" class="log-control log-search" type="search"
                                   placeholder="search&hellip;" autocomplete="off" spellcheck="false">
                            <span class="log-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                        </div>
                        <div id="log-box"></div>
                    </div>
                </div>
                <!-- what shows depends on whether the panel asks for a password: data-auth="open" only
                     without one, data-auth="login" only with one -->
                <div class="sys-pane hidden" data-pane="password">
                    <div class="sys-pane-inner">
                        <div class="card">
                            <div class="card-header">
                                <span class="t-strong">Reset Password</span>
                            </div>
                            <div class="card-body">
                                <form id="password-form" class="stack">
                                    <input id="current-password" type="password" autocomplete="current-password" placeholder="Current password"
                                        class="st-input" />
                                    <input id="new-password" type="password" autocomplete="new-password" placeholder="New password"
                                        class="st-input" />
                                    <input id="new-password2" type="password" autocomplete="new-password" placeholder="Confirm new password"
                                        class="st-input" />
                                </form>
                                <p class="t-small t-muted" data-auth="open">Needed only when the panel listens on the network.</p>
                            </div>
                        </div>
                        <div class="row row-wrap row-end row-loose sys-actions">
                            <button id="hub-btn-logout" type="button" class="btn sys-save" data-auth="login">Logout</button>
                            <button type="submit" form="password-form" class="btn sys-save">Reset</button>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <span class="t-strong">HTTPS for this panel</span>
                            </div>
                            <div class="card-body stack">
                                <p id="panel-tls-state" class="t-small t-muted"></p>
                                <form id="panel-tls-form" class="stack">
                                    <input id="panel-tls-cert" type="text" spellcheck="false" placeholder="Certificate: fullchain.pem" aria-label="Certificate" class="st-input" />
                                    <input id="panel-tls-key" type="text" spellcheck="false" placeholder="Private key: privkey.pem" aria-label="Private key" class="st-input" />
                                </form>
                                <p class="t-small t-muted">Files in the configuration's folder. Leave both empty for plain HTTP.</p>
                            </div>
                        </div>
                        <div class="row row-wrap row-end row-loose sys-actions">
                            <button type="submit" form="panel-tls-form" class="btn sys-save">Apply HTTPS</button>
                        </div>
                    </div>
                </div>
                <div class="sys-pane hidden" data-pane="about">
                    <div class="st st-about__setup">
                        <div><strong>Guided setup</strong><p>Walk through the receiver, the community map and the viewer again.</p></div>
                        <button id="hub-btn-wizard" type="button" class="st-btn st-btn--sm">Run setup</button>
                    </div>
                    <div class="sys-pane-inner sys-pb">
                        <div class="alert alert-warning sys-status-alert">
                            <svg class="alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            <div class="t-small t-warn stack-tight">
                                <p class="t-strong">Research and educational software &mdash; not for operational use</p>
                                <p class="t-small">Do not rely on AIS-catcher for navigation, collision avoidance or any application where safety of life or property is at stake.
                                    Receiving radio signals may be regulated or restricted in your country; you are responsible for complying with local laws before use.</p>
                            </div>
                        </div>

                            <div class="col row-center sys-pad-head">

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer id="st-footer" class="st st-footer" hidden>
            <span class="st-spacer"></span>
            <span class="st-dirty" role="status" hidden>Unsaved changes</span>
            <button class="st-btn" type="button" data-st-cancel>Cancel</button>
            <button class="st-btn st-btn--primary" type="button" data-st-save disabled>Save changes</button>
        </footer>
    </template>

    <div id="page-bar" class="st msgbar msgbar--page" role="status" aria-live="polite" hidden></div>
    <nav id="bottom-bar">
        <div id="bar-inner">
        <div id="bar-left">
            <button id="bar-collapse" type="button" title="Hide controls" aria-label="Hide controls">
                <span class="expand_more_icon"></span>
            </button>
            <div class="bar-divider div-640"></div>
            <div id="channel-leds"></div>
        </div>
        <div id="nav-buttons">
            <button id="nav-start-restart" class="hub-button" data-view="control" title="Start AIS-catcher">
                <span id="nav-sr-icon" class="engine_start_icon"></span>
                <span id="nav-sr-label">Start</span>
            </button>
            <button id="nav-btn-settings" class="hub-button" data-view="settings" title="Stations, inputs, outputs, services and the system">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
                <span>Settings</span>
            </button>
        </div>
        <div id="bar-right">
            <div id="status-dot-wrap">
                <div class="tooltip-anchor">
                    <span id="status-dot" class="dot"></span>
                    <div class="tooltip stack-tight">
                        <div id="status-dot-label" class="t-small">Checking&#8230;</div>
                        <div id="status-dot-uptime" class="t-small t-subtle"></div>
                    </div>
                </div>
                <span id="status-dot-text" class="t-small t-subtle sys-wide-only"></span>
                <button id="log-alerts" type="button" class="bar-alerts" hidden></button>
            </div>
            <div class="bar-divider div-768"></div>
            <a id="community-link" href="https://www.aiscatcher.org" target="_blank" rel="noopener"
                title="AIS-catcher community map">
                <svg viewBox="0 0 106.63 101.41" fill="currentColor">
                    <g transform="translate(-2.8209 -5.1046)">
                        <path d="m100.94 53.199h-3.5e-4c-0.0018 12.359-5.0165 23.535-13.138 31.663-8.1284 8.1213-19.304 13.136-31.663 13.138-12.359-0.00176-23.535-5.0168-31.663-13.138-8.1216-8.1284-13.136-19.304-13.138-31.663h-8.5132c-0.0019 14.692 5.9867 28.045 15.632 37.683 9.6383 9.6449 22.991 15.634 37.683 15.632 14.692 2e-3 28.045-5.9866 37.683-15.632 9.6446-9.6379 15.633-22.991 15.632-37.683h-8.5132" />

                    </g>
                </svg>
            </a>
        </div>
        </div>
    </nav>

    <button id="bar-restore" type="button" title="Show controls" aria-label="Show controls">
        <span id="restore-dot"></span>
        <span id="restore-label">Controls</span>
        <span class="expand_less_icon"></span>
    </button>

    <button id="login-pill" type="button" title="Sign in" aria-label="Sign in">
        <span class="login_icon"></span>
        <span>Login</span>
    </button>

    <script type="module" src="control-app.js?hash="></script>
</body>
</html>
