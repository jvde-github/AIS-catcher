<aside id="measurecard" class="mapcard measurecard measurecard-width">
	<header class="dialog-header">
		<div class="dialog-title">Measure<span class="dialog-title-hint">(shift-click)</span>
		</div>
		<i title="drag to move"
			class="dialog-header-action drag_indicator_icon draggable draggable-hide-if-not-active"></i>
		<span title="Shift+click on map to measure" data-action="setMeasureMode"
			class="dialog-header-action">
			<svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960" width="16px"
				fill="currentColor">
				<path
					d="M440-400h80v-120h120v-80H520v-120h-80v120H320v80h120v120Zm40 214q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm0 106Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 100-79.5 217.5T480-80Zm0-480Z" />
			</svg>
		</span>
		<div title="close this window" data-action="toggleMeasurecard" class="close_icon"></div>
	</header>

	<div class="mapcard-content" style="padding: 2px 10px 10px 10px;">
		<table class="mapcard-table">
			<thead>
				<tr>
					<th></th>
					<th></th>
					<th>FROM</th>
					<th>TO</th>
					<th>DIST</th>
					<th>BRG</th>
				</tr>
			</thead>
			<tbody id="measurecardInner">

			</tbody>
		</table>
	</div>

</aside>
