<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>AIS-catcher</title>

	<meta name="viewport"
		content="width=device-width,height=device-height,initial-scale=1.0,maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<link rel="icon" type="image/x-icon" href="favicon.ico">

</head>

<body>
	<div id="headerbar" class="header noandroid nokiosk">
		<div data-action="toggleMenu" class="header-menubutton">
			<div class="header-menu-box"><i id="header_menu_button" class="menu_icon"></i></div>
		</div>
		<div class="header-title">
			<span data-action="headerClick">AIS-catcher</span>

			<div id="menubar_mini" class="showflex">
				<i id="map_tab_mini" title="Live map of received vessels" data-action="activateTab" data-tab="map" class="map_icon"><span class="mb-name">Map</span></i>
				<i id="stat_tab_mini" title="System and receiver statistics" data-action="activateTab" data-tab="stat"
					class="business_center_icon"><span class="mb-name">Statistics</span></i>
				<i id="plots_tab_mini" title="Graphs of message and vessel counts over time" data-action="activateTab" data-tab="plots" class="leaderboard_icon"><span class="mb-name">Plots</span></i>
				<i id="ships_tab_mini" title="Searchable table of received vessels" data-action="activateTab" data-tab="ships" class="table_icon"><span class="mb-name">Ships</span></i>
				<i id="realtime_tab_mini" title="Live stream of received NMEA messages" data-action="activateTab" data-tab="realtime"
					class="timer_icon"><span class="mb-name">NMEA</span></i>
				<i id="log_tab_mini" title="Application log" data-action="activateTab" data-tab="log" class="terminal_icon"><span class="mb-name">Log</span></i>
				<i id="decoder_tab_mini" title="Decode raw NMEA sentences" data-action="activateTab" data-tab="decoder"
					class="comment_icon"><span class="mb-name">Decoder</span></i>
				<i id="about_tab_mini" title="About this station" data-action="activateTab" data-tab="about" class="info_icon"><span class="mb-name">About</span></i>
				<i id="webcontrol_tab_mini" title="Open Web Control" data-action="openWebControl" class="play_circle_icon"><span class="mb-name">Control</span></i>
			</div>
		</div>

		<button type="button" id="header-search-button" title="Search vessels, stations and places" aria-label="Search vessels, stations and places" data-action="toggleSearch" class="header-icon">
			<i class="search_icon small-icon" aria-hidden="true"></i>
		</button>

		<div title="Settings" data-action="openSettings" class="header-icon">
			<i class="settings_icon small-icon"></i>
		</div>

		<div id="theme-toggle-button" title="Switch between day and night" data-action="toggleDarkMode" class="header-icon">

			</svg>
			<svg id="theme-toggle-sun" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor" style="display:none">
				<path d="M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-96-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z" />
			</svg>
		</div>
	</div>
	<div class="overlay" id="menubar-overlay" data-action="hideMenu"></div>
	<nav id="menubar" class="menubar nokiosk">
		<div data-action="activateTab" data-tab="map" id="map_tab" title="Live map of received vessels"><i class="map_icon"></i><span>Map</span></div>
		<div data-action="activateTab" data-tab="stat" id="stat_tab" title="System and receiver statistics"><i class="business_center_icon"></i><span>Statistics</span>
		</div>
		<div data-action="activateTab" data-tab="plots" id="plots_tab" title="Graphs of message and vessel counts over time"><i class="leaderboard_icon"></i><span>Plots</span>
		</div>
		<div data-action="activateTab" data-tab="ships" id="ships_tab" title="Searchable table of received vessels"><i class="table_icon"></i><span>Ships</span></div>
		<div data-action="activateTab" data-tab="realtime" id="realtime_tab" title="Live stream of received NMEA messages"><i class="timer_icon"></i><span>NMEA</span>
		</div>
		<div data-action="activateTab" data-tab="log" id="log_tab" title="Application log"><i class="terminal_icon"></i><span>Log</span></div>
		<div data-action="activateTab" data-tab="decoder" id="decoder_tab" title="Decode raw NMEA sentences"><i class="comment_icon"></i><span>Decoder</span>
		</div>
		<div data-action="activateTab" data-tab="about" id="about_tab" title="About this station"><i class="info_icon"></i><span>About</span></div>
		<div data-action="openWebControl" id="webcontrol_tab" title="Open Web Control"><i class="play_circle_icon"></i><span>Control</span></div>
	</nav>

	<div class="mainspace-container">
		<div class="toast-container" id="notification-container"></div>
		<div class="search-scrim" id="search-scrim" hidden></div>
		<div id="search-panel" hidden></div>

		<div class="tableside_window tabcontent" id="tableside">
			<div class="settings-header table-overview-header">
				<span id="tableside_title" class="side-table-label">In view</span>
				<span id="tableside_count" class="sp-count"></span>
				<button type="button" data-action="hideTablecard" class="table-collapse" title="Close sidebar" aria-label="Close sidebar">Close <span aria-hidden="true">→</span></button>
			</div>

			<div class="sp-filter">
				<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></g></svg>
				<input id="tableside_filter" type="search" placeholder="Filter by name or MMSI" autocomplete="off" spellcheck="false" aria-label="Filter vessels in view">
			</div>
			<div class="tablecard_inner">
				<table class="mytable">
					<thead>
						<tr>
							<th data-column="shipname" class="sort-icon col-name" data-action="updateTableSort">Name</th>
							<th data-column="distance" class="sort-icon num col-dist" data-action="updateTableSort">Dist <span id="table_dist_unit"></span></th>
							<th data-column="speed" class="sort-icon num col-spd" data-action="updateTableSort">Spd <span id="table_spd_unit"></span></th>
							<th data-column="type" class="sort-icon col-type" data-action="updateTableSort">Type</th>
							<th data-column="last_signal" class="sort-icon num col-last" data-action="updateTableSort">Last</th>
						</tr>
					</thead>
					<tbody id="tablecardBody"></tbody>
				</table>
			</div>
			<footer class="table-footer">
				<span class="table-count" aria-live="polite"></span>
				<div class="table-pager" id="tablePager">
					<button type="button" data-action="tablePagePrev" title="Previous page" aria-label="Previous page">&#8249;</button>
					<span id="tablePageLabel"></span>
					<button type="button" data-action="tablePageNext" title="Next page" aria-label="Next page">&#8250;</button>
				</div>
			</footer>
		</div>

		<!-- @include features/settings/settings.html -->
