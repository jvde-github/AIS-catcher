<div class="tabcontent addscrollbar" id="plots" style="display: none;">
	<div class="sheet-tabs" id="plots_modes" style="display: none;">
		<div class="sheet-tab active" data-action="setPlotsMode" data-mode="overview">Overview</div>
		<div class="sheet-tab" data-action="setPlotsMode" data-mode="compare">Compare</div>
		<div class="sheet-scope" id="plots_scope"></div>
	</div>
	<div class="chart-sources" id="chart_sources" style="display: none;">
		<span>Compared with</span><span id="chart_source_b"></span>
	</div>
	<div class="graphtab" data-on-contextmenu="plotsContextMenu">
		<div class="graph-panel compare-panel">
			<header>Messages — A vs B</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-compare-messages" data-period="minute">Minute</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-compare-messages" data-period="hour">Hour</button>
				</div>
			</div>
			<div id="chart-compare-messages"></div>
		</div>
		<div class="graph-panel compare-panel">
			<header>Message Gain — B vs A</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-compare-gain" data-period="minute">Minute</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-compare-gain" data-period="hour">Hour</button>
				</div>
			</div>
			<div id="chart-compare-gain"></div>
		</div>
		<div class="graph-panel compare-panel">
			<header>Vessels — A vs B</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-compare-vessels" data-period="minute">Minute</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-compare-vessels" data-period="hour">Hour</button>
				</div>
			</div>
			<div id="chart-compare-vessels"></div>
		</div>
		<div class="graph-panel polar-none">
			<header>Busy Hours</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setBusyMeasure" data-measure="messages">Messages</button>
					<button type="button" data-action="setBusyMeasure" data-measure="vessels">Vessels</button>
					<button type="button" data-action="setBusyMeasure" data-measure="signal">Signal</button>
					<button type="button" data-action="setBusyMeasure" data-measure="noise">Noise floor</button>
					<button type="button" data-action="setBusyMeasure" data-measure="load">Load</button>
				</div>
			</div>
			<div class="busy-grid" id="chart-busy"></div>
			<div class="polar-sub"></div>
		</div>
		<div class="graph-panel range-panel polar-panel polar-none">
			<header>Coverage</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setCoveragePeriod" data-period="hour">Last hour</button>
					<button type="button" data-action="setCoveragePeriod" data-period="day">24 hours</button>
					<button type="button" data-action="setCoveragePeriod" data-period="week">7 days</button>
				</div>
				<div class="plot-seg">
					<button type="button" data-action="setCoverageMeasure" data-measure="n">Messages</button>
					<button type="button" data-action="setCoverageMeasure" data-measure="level">Signal</button>
				</div>
			</div>
			<div class="polar-plot">
				<canvas id="chart-coverage" role="img"></canvas>
				<div class="polar-tip" hidden></div>
			</div>
			<div class="polar-sub"></div>
			<div class="polar-legend"></div>
		</div>
		<div class="graph-panel">
			<header>Messages</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-messages" data-period="second">Second</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-messages" data-period="minute">Minute</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-messages" data-period="hour">Hour</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-messages" data-period="day">Day</button>
				</div>
			</div>
			<div id="chart-messages"></div>
		</div>
		<div class="graph-panel">
			<header>Vessels</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-vessels" data-period="minute">Minute</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-vessels" data-period="hour">Hour</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-vessels" data-period="day">Day</button>
				</div>
			</div>
			<div id="chart-vessels"></div>
		</div>
		<div class="graph-panel">
			<header>Frequency Shift (avg PPM)</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-ppm" data-period="minute">Minute</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-ppm" data-period="hour">Hour</button>
				</div>
			</div>
			<div id="chart-ppm"></div>
		</div>
		<div class="graph-panel">
			<header>Signal Level (Min/Max dB)</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-level" data-period="minute">Minute</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-level" data-period="hour">Hour</button>
				</div>
			</div>
			<div id="chart-level"></div>
		</div>
		<div class="graph-panel polar-none">
			<header>Channel Load (%)</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-load" data-period="minute">Minute</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-load" data-period="hour">Hour</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-load" data-period="day">Day</button>
				</div>
				<div class="plot-seg">
					<button type="button" data-action="setLoadMeasure" data-measure="load">Load</button>
					<button type="button" data-action="setLoadMeasure" data-measure="clipping">Clipping</button>
				</div>
			</div>
			<div id="chart-load"></div>
		</div>
		<div class="graph-panel range-panel">
			<header>Distance (Max <span class="distunit">NMi</span>)</header>
			<div class="plot-bar">
				<div class="plot-seg">
					<button type="button" data-action="setPlotPeriod" data-chart="chart-distance" data-period="hour">Hour</button>
					<button type="button" data-action="setPlotPeriod" data-chart="chart-distance" data-period="day">Day</button>
				</div>
			</div>
			<div id="chart-distance"></div>
		</div>
		<div class="graph-panel range-panel polar-panel polar-none">
			<header>GNSS Sky</header>
			<div class="polar-plot">
				<canvas id="chart-sky" role="img"></canvas>
				<div class="polar-tip" hidden></div>
			</div>
			<div class="polar-sub"></div>
			<div class="polar-legend"></div>
		</div>
		<div class="graph-panel range-panel fill-panel polar-none">
			<header>Satellite Signals</header>
			<div class="sat-bars" id="sky-signals"></div>
		</div>
	</div>
</div>
